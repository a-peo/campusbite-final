<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canteen Pre-Booking System</title>
  <meta name="description" content="Pre-book campus canteen meals, skip the queue and collect at your counter." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23157a3c'/%3E%3Cg fill='none' stroke='white' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M22 14v16a5 5 0 0 0 10 0V14'/%3E%3Cpath d='M27 14v36'/%3E%3Cpath d='M44 14c-4 4-4 14 0 18v18'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-mark">🍽</div>
      <p>Loading the canteen…</p>
    </div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <script defer src="js/app.bundle.js"></script>
  <script>
    // If the app never boots, say so instead of showing a loader forever.
    setTimeout(function () {
      var boot = document.querySelector("#app .boot");
      if (!boot) return;
      boot.innerHTML =
        '<div class="boot-mark">🍽</div>' +
        '<h1 class="boot-title">The canteen did not start</h1>' +
        '<p class="boot-copy">Reload the page, and if it still fails check that <code>js/app.bundle.js</code> sits next to <code>index.html</code> and open the browser console for details.</p>';
    }, 2500);
  </script>
</body>
</html>
